<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 960" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f83c8"/>
      <stop offset=".4" stop-color="#6e9fd4"/>
      <stop offset=".78" stop-color="#8bb2dd"/>
      <stop offset="1" stop-color="#a8c7e3"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf4fc" stop-opacity="0"/>
      <stop offset="1" stop-color="#eff7fc" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff" stop-opacity=".96"/>
      <stop offset=".48" stop-color="#f8fcff" stop-opacity=".77"/>
      <stop offset="1" stop-color="#f8fcff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloudShade" cx="50%" cy="35%" r="65%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#e8f3fb" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <filter id="softSmall" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="texture" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="2" seed="13"/>
      <feColorMatrix values=".24 0 0 0 .45 .24 0 0 0 .57 .24 0 0 0 .72 0 0 0 .1 0"/>
    </filter>
  </defs>
  <path fill="url(#sky)" d="M0 0h720v960H0z"/>
  <g filter="url(#soft)" opacity=".68">
    <ellipse cx="30" cy="470" rx="150" ry="72" fill="url(#cloud)"/>
    <ellipse cx="210" cy="625" rx="180" ry="76" fill="url(#cloud)"/>
    <ellipse cx="590" cy="540" rx="190" ry="78" fill="url(#cloud)"/>
    <ellipse cx="420" cy="710" rx="210" ry="90" fill="url(#cloud)"/>
    <ellipse cx="30" cy="820" rx="230" ry="100" fill="url(#cloud)"/>
    <ellipse cx="260" cy="870" rx="245" ry="100" fill="url(#cloud)"/>
    <ellipse cx="560" cy="835" rx="250" ry="112" fill="url(#cloud)"/>
    <ellipse cx="760" cy="920" rx="230" ry="110" fill="url(#cloud)"/>
  </g>
  <g filter="url(#softSmall)" opacity=".38">
    <ellipse cx="50" cy="456" rx="110" ry="45" fill="url(#cloudShade)"/>
    <ellipse cx="260" cy="610" rx="125" ry="54" fill="url(#cloudShade)"/>
    <ellipse cx="640" cy="520" rx="140" ry="55" fill="url(#cloudShade)"/>
    <ellipse cx="480" cy="700" rx="155" ry="64" fill="url(#cloudShade)"/>
    <ellipse cx="180" cy="835" rx="180" ry="70" fill="url(#cloudShade)"/>
    <ellipse cx="570" cy="810" rx="180" ry="78" fill="url(#cloudShade)"/>
  </g>
  <path fill="#fff" opacity=".07" filter="url(#texture)" d="M0 0h720v960H0z"/>
</svg>
